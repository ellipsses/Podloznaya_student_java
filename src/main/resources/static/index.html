<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Студенты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Студенты</h1>
    <span id="count" class="muted"></span>
    <div class="who">
      <span id="who"></span>
      <button type="button" id="to-users" class="secondary" hidden>Пользователи</button>
      <button type="button" id="logout" class="secondary">Выйти</button>
    </div>
  </header>

  <main class="layout" id="layout">
    <div class="col">
      <section class="card">
        <h2 id="form-title">Новый студент</h2>
        <form id="form" novalidate>
          <label>Имя *
            <input name="name" maxlength="100" autocomplete="off" required>
          </label>
          <label>Фамилия *
            <input name="surname" maxlength="100" autocomplete="off" required>
          </label>
          <label>Телефон
            <input name="phone" type="tel" placeholder="+79991234567" autocomplete="off">
          </label>
          <label>Email
            <input name="email" type="email" placeholder="ivan@example.com" autocomplete="off">
          </label>
          <p id="edit-hint" class="muted hint" hidden>Имя и фамилию изменить нельзя: меняются только телефон и email.</p>
          <p id="form-error" class="error" hidden></p>
          <div class="actions">
            <button type="submit" id="submit">Добавить</button>
            <button type="button" id="cancel" class="secondary" hidden>Отмена</button>
          </div>
        </form>
      </section>

      <section class="card" id="details" hidden>
        <h2>Карточка студента</h2>
        <div id="details-body"></div>
        <div class="actions">
          <button type="button" id="edit" class="secondary">Изменить</button>
          <button type="button" id="delete" class="danger">Удалить</button>
        </div>
      </section>
    </div>

    <section class="card">
      <div class="list-head">
        <h2>Список</h2>
        <input id="search" type="search" placeholder="Поиск по имени">
      </div>
      <details id="all" class="all">
        <summary>Все студенты</summary>
        <ul id="list" class="list"></ul>
      </details>
      <p id="state" class="muted"></p>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
